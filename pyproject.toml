[project]
name = "energy-minerals-atlas"
version = "1.0.0"
description = "Interactive world map of the minerals behind clean energy, built from USGS data."
requires-python = ">=3.10"
license = "MIT"
dependencies = ["pandas>=2.0", "requests>=2.31", "pypdf>=4.0"]

[tool.black]
line-length = 110

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
